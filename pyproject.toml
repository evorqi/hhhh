[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleaning-workspace"
version = "0.1.0"
description = "Local Smart Excel and data-cleaning workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.1",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "openpyxl==3.1.5",
  "jdatetime==5.3.0",
  "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
